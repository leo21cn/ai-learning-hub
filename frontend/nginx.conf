server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # 允许上传大文�?与后�?material service MAX_SIZE_BYTES=500MB 对齐)
  # 家用网络 5�?0Mbps 上传 500MB 需 400�?00s,必须�?client_body_timeout
  # �?proxy_send_timeout 拉到 10 分钟；否�?nginx 默认 60s 就会切断请求�?
  client_max_body_size 500m;
  client_body_buffer_size 1m;
  client_body_timeout 600s;
  proxy_send_timeout 600s;
  proxy_read_timeout 600s;

  # gzip
  gzip on;
  gzip_types text/plain application/json application/javascript text/css;

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  # 反代 API 到后端容�?也覆�?/admin/* 路径以保持会话路径一�?
  # 默认指向�?compose project 里的服务�?`backend`(本地/单机 docker-compose �?�?
  # swarm stack 下后端服务名�?`learning-hub_backend`,�?publish.ps1 构建�?sed 替换�?`learning-hub_backend`�?
  location /api/ {
    proxy_pass http://learning-hub_backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    # 关闭 request body 缓存,边收边转�?避免大文件先存盘再发往后端
    proxy_request_buffering off;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    proxy_connect_timeout 60s;
    client_max_body_size 500m;
  }

  # 静态资源缓�?
  location ~* \.(?:js|css|svg|png|jpg|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # PDF.js worker(.mjs)需明确 JavaScript MIME,避免部分浏览器拒加载
  location = /pdf.worker.min.mjs {
    types { application/javascript mjs; }
    add_header Cache-Control "public, max-age=86400";
  }
}
