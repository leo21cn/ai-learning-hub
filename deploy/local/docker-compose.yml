# ===== Learning Hub Local Docker Compose =====

services:
  postgres:
    image: docker.m.daocloud.io/library/postgres:16-alpine
    container_name: lh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lh
      POSTGRES_PASSWORD: lh
      POSTGRES_DB: learning_hub
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lh -d learning_hub"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: lh-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # env_file 指向本地 backend/.env（含真实 DASHSCOPE_API_KEY），不入仓。
    # 本地首次使用时: `cp backend/.env.example backend/.env` 后填入 key。
    # 模板 backend/.env.example 与本地 backend/.env 并存：后者含凭据，git 忽略。
    env_file:
      - ../backend/.env
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: lh
      DATABASE_PASSWORD: lh
      DATABASE_NAME: learning_hub
      ADMIN_TOKEN: shleeyuan
      JWT_SECRET: dev-jwt-secret-change-in-production-please-32-chars-min-xxx
      TZ: Asia/Shanghai
    ports:
      - "8000:8000"
    volumes:
      - storage:/app/storage

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: lh-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"
    # 覆盖 Dockerfile 内置的 wget healthcheck:wget 默认走 IPv6 ::1 而 nginx 只监听 IPv4,
    # 因此改用 curl -fsS 强制 IPv4(127.0.0.1),并探测 / + /api/public/health 同时验证 nginx
    # 反向代理到后端工作正常。
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1/ && curl -fsS -o /dev/null http://127.0.0.1/api/public/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
  storage:
